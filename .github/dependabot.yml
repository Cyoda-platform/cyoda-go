version: 2

# Every entry targets the ACTIVE release branch, never `main`. Work is staged
# on `release/vX.Y.Z` and merged to `main` only at the release cut, so a bump
# raised against `main` lands where nothing is being built and has to be
# re-applied by hand on the release branch — which is what a dependency gate is
# supposed to prevent.
#
# `target-branch` must therefore be updated in lock-step with the release
# branches, and the branch named here MUST exist: Dependabot fails silently
# against a branch that does not. Both halves of that are release-checklist
# steps, not something to remember ad hoc — see MAINTAINING.md, "Cutting a
# release": gate 0 moves this field to the next release branch, and step 10
# opens the branch it names. Change every entry below together; a mixed set
# sends some ecosystems to a dead branch.

updates:
  # Root Go module
  - package-ecosystem: gomod
    directory: "/"
    target-branch: release/v0.9.0
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # The cyoda-go-spi pin is a maintainer-owned coordinated-release step
    # (MAINTAINING.md "Coordinated release across sibling repos"), not a routine
    # bump. Ignoring it keeps the grouped third-party PRs from being entangled
    # with — and mass-closed alongside — an unresolvable SPI pin mid-milestone.
    ignore:
      - dependency-name: "github.com/cyoda-platform/cyoda-go-spi"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Plugin submodules each have their own go.mod and are independently
  # consumable, so each must be tracked separately.
  - package-ecosystem: gomod
    directory: "/plugins/memory"
    target-branch: release/v0.9.0
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "github.com/cyoda-platform/cyoda-go-spi"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: "/plugins/sqlite"
    target-branch: release/v0.9.0
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "github.com/cyoda-platform/cyoda-go-spi"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: "/plugins/postgres"
    target-branch: release/v0.9.0
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "github.com/cyoda-platform/cyoda-go-spi"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Container base image. Tracks the digest pin in deploy/docker/Dockerfile
  # so distroless/static base updates surface as PRs.
  - package-ecosystem: docker
    directory: "/deploy/docker"
    target-branch: release/v0.9.0
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: release/v0.9.0
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
